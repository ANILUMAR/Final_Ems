<div class="ems-shell"
     [class.ems-shell--right]="navPref.sidebarPosition() === 'right'"
     [class.ems-shell--compact]="navPref.layoutStyle() === 'compact'"
     [class.ems-shell--icon-only]="navPref.layoutStyle() === 'icon-only'"
     [class.ems-shell--top-nav]="navPref.navType() === 'top'">
  <app-sidebar *ngIf="showHeader && navPref.navType() === 'sidebar'"></app-sidebar>

  <div class="ems-shell__main">
    <app-header *ngIf="showHeader"></app-header>
    <main class="ems-shell__content">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
