<aside class="ems-sidebar"
       [class.ems-sidebar--compact]="navPref.layoutStyle() === 'compact'"
       [class.ems-sidebar--icon-only]="navPref.layoutStyle() === 'icon-only'"
       [class.ems-sidebar--expanded]="navPref.layoutStyle() === 'expanded'"
       [class.ems-sidebar--docked-right]="navPref.sidebarPosition() === 'right'">
  <div class="ems-sidebar__brand">
    <span class="ems-sidebar__logo" [matTooltip]="isIconOnly ? 'EMS Employee Suite' : ''" [matTooltipPosition]="tooltipPosition">
      <mat-icon>hub</mat-icon>
    </span>
    <span class="ems-sidebar__brand-text" *ngIf="!isIconOnly">
      <strong>EMS</strong>
      <small>Employee Suite</small>
    </span>
  </div>

  <div class="ems-sidebar__nav-header" *ngIf="!isIconOnly && navPref.layoutStyle() !== 'expanded' && navPref.navDisplayMode() !== 'always-expanded'">
    <span class="ems-sidebar__nav-label">Modules</span>
    <button
      type="button"
      class="ems-sidebar__toggle-all-btn"
      (click)="toggleAllGroups()"
      [matTooltip]="allExpanded ? 'Collapse all modules' : 'Expand all modules'">
      <mat-icon>{{ allExpanded ? 'unfold_less' : 'unfold_more' }}</mat-icon>
      <span>{{ allExpanded ? 'Collapse All' : 'Expand All' }}</span>
    </button>
  </div>

  <nav class="ems-sidebar__nav">
    <div class="ems-sidebar__group" *ngFor="let group of groups">
      <ng-container *ngIf="groupHasItems(group)">
        <!-- Main Module Heading: Click to Expand / Collapse -->
        <button
          type="button"
          class="ems-sidebar__module-btn"
          [class.is-expanded]="isGroupExpanded(group)"
          [class.has-active-child]="groupHasActiveRoute(group)"
          (click)="toggleGroup(group)"
          [matTooltip]="isIconOnly ? group.title : ''"
          [matTooltipPosition]="tooltipPosition"
          [attr.aria-expanded]="isGroupExpanded(group)">
          <div class="ems-sidebar__module-left">
            <mat-icon class="ems-sidebar__module-icon">{{ group.icon }}</mat-icon>
            <span class="ems-sidebar__module-title" *ngIf="!isIconOnly">{{ group.title }}</span>
          </div>

          <div class="ems-sidebar__module-right" *ngIf="!isIconOnly">
            <span
              class="ems-sidebar__active-indicator"
              *ngIf="groupHasActiveRoute(group) && !isGroupExpanded(group)"
              matTooltip="Current screen is in this section">
            </span>
            <mat-icon class="ems-sidebar__module-chevron" *ngIf="navPref.layoutStyle() !== 'expanded' && navPref.navDisplayMode() !== 'always-expanded'">
              {{ isGroupExpanded(group) ? 'expand_more' : 'chevron_right' }}
            </mat-icon>
          </div>
        </button>

        <!-- Associated Screens: Expanded when clicked -->
        <div
          class="ems-sidebar__subnav"
          *ngIf="isGroupExpanded(group)"
          role="region"
          [attr.aria-label]="group.title + ' screens'">
          <ng-container *ngFor="let item of group.items">
            <a
              class="ems-sidebar__link"
              *ngIf="isVisible(item)"
              [routerLink]="item.route"
              [queryParams]="item.queryParams"
              [class.is-active]="isActive(item)"
              [matTooltip]="isIconOnly ? item.label : ''"
              [matTooltipPosition]="tooltipPosition"
              [attr.aria-current]="isActive(item) ? 'page' : null">
              <mat-icon>{{ item.icon }}</mat-icon>
              <span *ngIf="!isIconOnly">{{ item.label }}</span>
            </a>
          </ng-container>
        </div>
      </ng-container>
    </div>
  </nav>

  <div class="ems-sidebar__footer" [matTooltip]="isIconOnly ? (name + ' (' + (role || 'MEMBER') + ')') : ''" [matTooltipPosition]="tooltipPosition">
    <div class="ems-sidebar__avatar-wrap">
      <img [src]="avatarUrl" alt="Avatar" class="ems-sidebar__avatar-img" (error)="onImgError($event)" />
      <span class="ems-sidebar__avatar ems-sidebar__avatar--fallback" style="display:none">{{ initials }}</span>
    </div>
    <span class="ems-sidebar__user" *ngIf="!isIconOnly">
      <strong>{{ name }}</strong>
      <small>{{ role || 'MEMBER' }}</small>
    </span>
  </div>
</aside>
