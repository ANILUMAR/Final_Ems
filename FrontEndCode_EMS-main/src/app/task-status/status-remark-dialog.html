<h2 mat-dialog-title>Reopen this item</h2>

<mat-dialog-content>
  <p class="sr-sub">
    <strong>{{ data.title || ('#' + data.id) }}</strong> is already marked
    <em>{{ data.from }}</em>. Add a remark explaining why it is moving back to
    <em>{{ data.to }}</em> — it is saved to the status history.
  </p>

  <mat-form-field appearance="outline" class="sr-field">
    <mat-label>Remark</mat-label>
    <textarea
      matInput
      rows="4"
      maxlength="500"
      cdkFocusInitial
      [(ngModel)]="note"
      placeholder="For example: testing found a defect in the export step."></textarea>
    <mat-hint align="end">
      {{ remark.length }}/500{{ isValid ? '' : ' · required' }}
    </mat-hint>
  </mat-form-field>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-stroked-button [mat-dialog-close]="null">Cancel</button>
  <button mat-flat-button color="primary" [disabled]="!isValid" [mat-dialog-close]="remark">
    <mat-icon>save</mat-icon>
    Move to {{ data.to }}
  </button>
</mat-dialog-actions>
