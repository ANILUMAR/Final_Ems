<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title></title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <!-- Roboto and the Material Icons ligature font, served from the app's own
       uploads/images folder instead of fonts.googleapis.com: the shell must
       render with no internet. See uploads/images/ems-fonts.css. -->
  <link href="http://localhost:9001/attachments/ems-fonts.css" rel="stylesheet">
  <script>
    // Paint the remembered theme before Angular boots so the shell never flashes.
    (function () {
      var theme = 'dark';
      try {
        if (localStorage.getItem('theme') === 'light') { theme = 'light'; }
      } catch (error) { /* blocked storage: keep the dark default */ }
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
  
</head>
<body class="mat-typography">
  <app-root></app-root>
</body>
</html>
