spring.application.name=canteenManagment

server.port=9001
#server.address=0.0.0.0

# Datastore: local MongoDB (mongod --dbpath <dir> --port 27017)
spring.data.mongodb.uri=mongodb://127.0.0.1:27017/ems_db
# Create the three demo logins + sample projects/tasks/timesheets when the
# collections are empty. Set to false once the data lives in Mongo.
ems.seed.enabled=true
ems.reset.work.data=false
management.endpoint.shutdown.enabled=false
spring.cache.type=simple

# --- Password review copy -------------------------------------------------
# Every password is stored twice: the BCrypt hash the security layer verifies,
# and an AES-GCM copy that only GET /api/auth/users/{id}/password (ADMIN) can
# decrypt, so the Edit employee dialog can show the saved password.
# Changing this key does not lock anybody out - sign-in still uses the hash - it
# only makes the existing review copies unreadable. Use a real secret in
# production and keep it out of source control there.
ems.security.password-secret=ems-local-password-review-key

spring.debug=true
logging.level.org.springframework.security=DEBUG
# App Properties
bezkoder.app.jwtSecret= ======================BezKoder=Spring===========================
bezkoder.app.jwtExpirationMs=86400000

# --- Outbound mail ---------------------------------------------------------
# The workflow mails the new owner when work is assigned, and the team leads
# (administrator accounts) when an item reaches DONE. The SMTP account itself is
# configured further down (spring.mail.*). Turn ems.mail.enabled off to keep the
# notices in the log instead of sending them; a send failure is logged and never
# undoes the task action that triggered it.
ems.mail.enabled=true
ems.mail.from=workflow1@iitm.ac.in
ems.app.url=http://localhost:4200


spring.mail.host=smtp2.iitm.ac.in
spring.mail.port=25
spring.mail.username=workflow1@iitm.ac.in
spring.mail.password=wpassword
spring.mail.protocol=smtp
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.ssl.enable=false
spring.mail.properties.mail.smtp.starttls.enable=false
# A stuck SMTP handshake must not keep the mail thread waiting for minutes.
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

